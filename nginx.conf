# X-Forwarded-For vide ou absent : on retombe sur l'adresse du pair (sinon tout le monde partage la même IP).
map $http_x_forwarded_for $qd_xff {
    default $http_x_forwarded_for;
    ""      $remote_addr;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    location / {
        try_files $uri $uri/ =404;
    }

    # Multijoueur : WebSocket vers le serveur Node du même conteneur.
    # X-Forwarded-For : on garde tel quel celui posé par Traefik (le serveur lit sa dernière entrée).
    location = /ws {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $qd_xff;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Santé : passe par le serveur Node (HTTP 200 seulement s'il répond)
    location = /healthz {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # add_header d'une location remplace ceux du server : on réinclut le snippet commun
    # la police ne change jamais sans changer de nom : cache long
    location = /fonts/fredoka.woff2 {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(css|js|woff2)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # mime.types de l'image ne connaît pas .webmanifest (servi en octet-stream sinon)
    location = /site.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
    }
}
