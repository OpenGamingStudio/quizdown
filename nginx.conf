server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    location / {
        try_files $uri $uri/ =404;
    }

    # add_header d'une location remplace ceux du server : on réinclut le snippet commun
    location ~* \.(css|js|woff2)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # mime.types de l'image ne connaît pas .webmanifest (servi en octet-stream sinon)
    location = /site.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
    }
}
