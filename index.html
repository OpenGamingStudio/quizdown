<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuizDown</title>
<meta name="description" content="QuizDown : un quiz en solo ou à plusieurs sur le même appareil. Jeu web open source d'OpenGamingStudio.">
<meta name="theme-color" content="#f2eee3">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<link rel="preload" href="fonts/fredoka.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <button class="brand" id="home" type="button" aria-label="Retour à l'accueil">Quiz<span>Down</span></button>
  <button class="sound" id="sound" type="button" aria-pressed="true">Son : oui</button>
</header>
<main id="app" tabindex="-1" aria-live="polite"><noscript>QuizDown a besoin de JavaScript.</noscript></main>
<footer class="foot">Un jeu <a href="https://github.com/OpenGamingStudio/quizdown" rel="noopener noreferrer">open source</a> d'OpenGamingStudio · MIT</footer>
<script src="app.js"></script>
</body>
</html>
