<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Accueil · QuizDown</title>
<meta name="description" content="QuizDown : un quiz en solo ou à plusieurs sur le même appareil. Jeu web open source d'OpenGamingStudio.">
<meta name="theme-color" content="#E8402A">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self'; img-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="favicon-16.png" type="image/png" sizes="16x16">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="preload" href="fonts/fredoka.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="data/questions.json" as="fetch" type="application/json" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#app">Aller au contenu</a>
<div class="deco" aria-hidden="true"><svg class="d0" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="18" height="18" rx="2"/></svg><svg class="d1" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg><svg class="d2" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 23 21H1z"/></svg><svg class="d3" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1 23 12 12 23 1 12z"/></svg></div>
<header class="bar">
  <button class="brand" id="home" type="button" aria-label="QuizDown, retour à l'accueil">Quiz<span>Down</span></button>
  <div class="tools">
    <button class="sound" id="settings" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"></svg><span class="max-[479px]:sr-only">Réglages</span></button>
    <button class="sound" id="sound" type="button">Son</button>
  </div>
</header>
<div id="live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
<main id="app" tabindex="-1"><noscript>QuizDown a besoin de JavaScript.</noscript></main>
<footer class="foot">Un jeu <a href="https://github.com/OpenGamingStudio/quizdown" rel="noopener noreferrer">open source</a> d'OpenGamingStudio · MIT</footer>
<script src="app.js"></script>
</body>
</html>
